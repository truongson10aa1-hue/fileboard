:root{--ff:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#e8edf3;--dot:#bcc7d4;--sf:#fff;--tx:#14213d;--mu:#5d6b82;--ln:#d5dce6;--ac:#2f4bff;--on:#fff;--lkc:#0a62c9;--sh:0 1px 2px rgba(20,33,61,.08),0 8px 20px rgba(20,33,61,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--dot:#2a3445;--sf:#1a2231;--tx:#e8edf7;--mu:#8e9bb3;--ln:#2c3649;--ac:#8197ff;--on:#0c1020;--lkc:#5db0ff;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#10151f;--dot:#2a3445;--sf:#1a2231;--tx:#e8edf7;--mu:#8e9bb3;--ln:#2c3649;--ac:#8197ff;--on:#0c1020;--lkc:#5db0ff;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 var(--ff);display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
#shot{display:inline-flex;align-items:center;gap:6px}#shot svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#shotZ{display:none;position:absolute;right:14px;bottom:14px;z-index:35;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh)}body.zen #shotZ{display:grid}
button,input,select,textarea,dialog,summary{font-family:var(--ff)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--ln)}
.brand{font-weight:700;font-size:16px;margin-right:4px}
.search{flex:1 1 240px;max-width:420px}
input[type=search],input[type=text],input:not([type]){width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip,.ghost,.primary{font:inherit;border-radius:10px;padding:8px 12px;cursor:pointer;border:1px solid var(--ln);background:transparent;color:var(--tx)}
.chip{padding:6px 11px;border-radius:99px;color:var(--mu)}
.chip.on{background:var(--tx);color:var(--sf);border-color:var(--tx)}
.primary{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:500}
#cnt{color:var(--mu);font-size:12px;margin-left:auto}
#stage{flex:1;position:relative;min-height:0}
#sc{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;background:radial-gradient(var(--dot) 1.2px,transparent 1.2px) 0 0/26px 26px;transition:box-shadow .15s}
#sc.pan{cursor:grabbing}
#sc.over{box-shadow:inset 0 0 0 3px var(--ac)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#layS,#board,#layO{position:absolute;left:0;top:0}
#layS{z-index:0}
/* Đối tượng vẽ */
.ob{position:absolute;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.ob svg{pointer-events:none}.ob .sp{pointer-events:visiblePainted}.ob .hit{fill:none;stroke:transparent;pointer-events:stroke}
.ob .hl{fill:none;stroke:var(--ac);stroke-opacity:.35;stroke-linecap:round;visibility:hidden;pointer-events:none}.ob.sel .hl{visibility:visible}
.ob.sel{outline:2px solid var(--ac);outline-offset:4px}.ob.ln.sel{outline:none}
.otx{font-weight:500;line-height:1.25;white-space:pre;color:var(--oc);padding:2px 4px;min-width:12px;min-height:1em}
.otx.editing{outline:2px solid var(--ac);outline-offset:3px;cursor:text;user-select:text;-webkit-user-select:text;min-width:60px}
.otx.lnk{color:var(--lkc);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.otx.editing:empty::before{content:'Nhập văn bản…';opacity:.4}
.ob .h{display:none;position:absolute;width:14px;height:14px;border-radius:50%;background:var(--sf);border:3px solid var(--ac);box-sizing:border-box;cursor:nwse-resize}
.ob.sel .h{display:block}
/* Thanh nổi: bên trái, bên dưới, thuộc tính */
.ui{position:absolute;z-index:30;display:flex;align-items:center;gap:4px;padding:5px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh)}
.tbar{left:50%;bottom:14px;transform:translateX(-50%)}
.tbar .wrap{position:relative}
.fly{left:50%;bottom:calc(100% + 16px);transform:translateX(-50%);flex-direction:row}
.rbar{right:12px;top:50%;transform:translateY(-50%);flex-direction:column}
.zp{font-family:inherit;font-size:11px;font-weight:600;letter-spacing:-.2px}
/* Layer: thanh bên trái, sổ ra / sổ vào */
.lyr{left:12px;top:12px;bottom:78px;width:min(268px,calc(100% - 84px));z-index:31;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;transition:transform .22s ease,opacity .22s ease,visibility .22s}
.lyr.shut{transform:translateX(calc(-100% - 24px));opacity:0;visibility:hidden}
.lyT{left:12px;top:12px;transition:opacity .2s,visibility .2s}.lyT.hide{opacity:0;visibility:hidden;pointer-events:none}
.lyh{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-bottom:1px solid var(--ln)}
.lyt{font-weight:700}.lyn{flex:1;color:var(--mu);font-size:12px}
.ib.sm{width:30px;height:30px}.ib.sm svg{width:18px;height:18px}
.lyb{position:relative;flex:1;min-height:0;overflow:auto;padding:6px;overscroll-behavior:contain}
.lye{padding:22px 12px;color:var(--mu);font-size:12px;text-align:center}
.lr{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 calc(2px + var(--d,0)*16px);border-radius:8px;cursor:pointer;user-select:none;-webkit-user-select:none}
.lr:hover{background:var(--bg)}
.lr:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.lr.on{background:color-mix(in srgb,var(--ac) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 50%,transparent)}
.lr .tg{width:20px;height:20px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:6px;background:transparent;color:var(--mu);cursor:pointer}
button.tg:hover{background:var(--ln)}
.lr .tg svg,.lr .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lr .tg svg{transition:transform .15s}.lr .tg.cl svg{transform:rotate(-90deg)}
.lr .ic{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--tx)}
.lr.isS .ic{color:var(--s)}.lr.isC .ic{color:var(--c)}
.lr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr.isS .nm{font-weight:500}
.lr .nm[contenteditable=true]{outline:2px solid var(--ac);background:var(--bg);text-overflow:clip;border-radius:4px;padding:0 4px;cursor:text;user-select:text;-webkit-user-select:text}
.lr .ct{flex:none;font-size:11px;color:var(--mu)}
@media (min-width:641px){body.lyo .pbar{left:calc(50% + 109px);max-width:calc(100% - 354px)}}
@media (max-width:640px){#empty{padding:20px 76px 20px 20px}}
.pbar{left:50%;top:12px;transform:translateX(-50%);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 140px);gap:6px 8px}
.ib{width:38px;height:38px;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:transparent;color:var(--tx);cursor:pointer}
.ib:hover{background:var(--bg)}.ib.on{background:var(--ac);color:var(--on)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hsep{width:24px;height:1px;background:var(--ln);margin:2px 0}.vsep{width:1px;height:22px;background:var(--ln);margin:0 2px}
#sw{display:flex;gap:5px;flex-wrap:wrap}
.swc{width:22px;height:22px;border-radius:50%;border:2px solid var(--sf);box-shadow:0 0 0 1px var(--ln);cursor:pointer;padding:0}.swc.on{box-shadow:0 0 0 2px var(--ac)}
#cpick{width:26px;height:26px;padding:0;border:0;background:none;cursor:pointer}
.pbar .ghost{padding:3px 9px}.pbar .lab{font-size:12px;color:var(--mu)}#szv{min-width:22px;text-align:center;font-weight:500}
#sc.tl,#sc.tl *{cursor:crosshair!important}
body.zen header,body.zen #tabs,body.zen .ui:not(#lk){display:none}
body.zen #lk button{display:none}
#toast{position:absolute;z-index:40;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:var(--tx);color:var(--sf);font-size:13px;pointer-events:none;box-shadow:var(--sh);opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.lyr,.lyT,#toast{transition:none}}
#sc.sp{cursor:grab}
#mq{position:absolute;z-index:25;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);pointer-events:none;border-radius:3px}
.sec{transition:opacity .15s,filter .15s}.sec.dim{opacity:.22;filter:grayscale(1)}
#lk{flex-wrap:nowrap;white-space:nowrap;max-width:min(92%,460px);padding:4px 6px}
#lk a{color:var(--ac);text-decoration:none;font-weight:500;padding:4px 8px;max-width:300px;overflow:hidden;text-overflow:ellipsis}
#lk a:hover{text-decoration:underline}
#lk .ghost{padding:3px 9px;border-color:transparent}#lk .ghost:hover{background:var(--bg)}
#lk input{width:240px;padding:6px 10px}
.lkb{position:absolute;left:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:11px;font-style:normal;pointer-events:none;box-shadow:var(--sh)}
.zoom{display:flex;gap:4px}.zoom button{padding:6px 9px}

.tab.on{background:var(--bg);color:var(--tx);border-color:var(--tx);font-weight:500}
.tab.plus{border-style:dashed}
.tn[contenteditable=true],.stt[contenteditable=true]{outline:2px solid var(--ac);border-radius:4px;padding:0 4px;cursor:text;user-select:text;-webkit-user-select:text}
.tx,.sx,.rn{border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;padding:0 4px;border-radius:5px;opacity:.7}.tx.arm,.sx.arm{background:#d92d3a;color:#fff;opacity:1}
.sec{position:absolute;border-radius:12px;border:2px solid color-mix(in srgb,var(--s) 55%,transparent);background:color-mix(in srgb,var(--s) 11%,transparent)}
.sh .rn,.sh .sx{color:#fff}
.sh{display:flex;align-items:center;gap:8px;height:var(--hh,34px);padding:0 8px 0 12px;background:var(--s);color:#fff;border-radius:9px 9px 0 0;cursor:grab;user-select:none;-webkit-user-select:none}
.stt{flex:1;min-width:0;font-size:var(--fs,14px);color:var(--tc,#fff);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pal{display:flex;gap:4px}.pal i{width:13px;height:13px;border-radius:50%;border:2px solid #fff;cursor:pointer;display:block}

.rz[data-h=nw]{left:-8px;top:-8px;cursor:nwse-resize}.rz[data-h=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
.rz[data-h=ne]{right:-8px;top:-8px;cursor:nesw-resize}.rz[data-h=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}
.cz{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:var(--ac);border:2px solid var(--sf);cursor:nwse-resize;opacity:.55;transition:opacity .15s}.card:hover .cz,.card.drag .cz{opacity:1}
.card.sel{outline:2px solid var(--ac);outline-offset:3px}

.pgb{display:block;width:100%;margin-top:6px;padding:3px 0;font:inherit;border-radius:8px;border:1px solid var(--ln);background:transparent;color:var(--mu);cursor:pointer}
#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--mu);pointer-events:none;padding:20px}
#empty b{display:block;font-size:18px;color:var(--tx);margin-bottom:4px}
.card{position:absolute;width:184px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transition:opacity .15s,filter .15s}
.card.drag{cursor:grabbing}
.card.dim{opacity:.16;filter:grayscale(1)}
.th{position:relative;height:118px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--sf));border-top:4px solid var(--c);border-radius:11px 11px 0 0;overflow:hidden}

.doc *{max-width:100%}.doc p{margin:0 0 6px}.doc table{border-collapse:collapse}.doc td,.doc th{border:1px solid #c9d0dc;padding:2px 5px;white-space:nowrap}

dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,380px);background:var(--sf);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.35)}

<body>
<header>
  <div class="brand">Fileboard</div>
  <div class="search"><input id="q" type="search" placeholder="Tìm ảnh, video, mp3, PDF, Word, Excel, PPT, web, nén…" aria-label="Tìm kiếm"></div>
  <div class="chips" id="chips"></div>

  <div class="zoom"><button class="ghost" id="un" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác">↶</button><button class="ghost" id="re" title="Làm lại (Ctrl+Shift+Z)" aria-label="Làm lại">↷</button></div>
  <button class="ghost" id="shot" title="Chụp ảnh bảng (lưu PNG)" aria-label="Chụp màn hình"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Chụp màn hình</span></button>
  <button class="primary" id="add">+ Thêm file</button>
  <input type="file" id="file" multiple hidden>
</header>
<nav id="tabs"></nav>
<div id="stage">
<main id="sc">
  <div id="world"><div id="layS"></div><div id="board"></div><div id="layO"></div></div>
  <div id="empty"><div><b>Bảng đang trống</b>Kéo thả file vào đây hoặc bấm Thêm file.<br>Hỗ trợ PDF, Word, Excel, PowerPoint, ảnh, video, âm thanh (mp3), file web, file nén và mọi loại file khác.</div></div>
</main>
<button class="ib" id="shotZ" title="Chụp ảnh bảng (lưu PNG)" aria-label="Chụp màn hình"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
<div class="ui" id="lk" hidden></div>
<aside class="ui lyr" id="lyr" aria-label="Layer">
  <div class="lyh"><span class="lyt">Layer</span><span class="lyn" id="lyn"></span><button class="ib sm" id="lyx" title="Thu gọn layer (L)" aria-label="Thu gọn layer"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>

<div class="ui tbar" id="tbar">
  <button class="ib on" data-t="select" title="Chọn / di chuyển (V)" aria-label="Chọn"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
  <button class="ib" data-t="text" title="Thêm text (T)" aria-label="Thêm text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
  <div class="wrap">
    <button class="ib" data-t="shape" title="Thêm hình (S)" aria-label="Thêm hình"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="11" height="11" rx="2"/><circle cx="15" cy="15" r="6"/></svg></button>
    <div class="ui fly" id="fly" hidden>
      <button class="ib" data-k="rect" title="Hình chữ nhật"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></button>
      <button class="ib" data-k="ellipse" title="Hình tròn / elip"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
      <button class="ib" data-k="tri" title="Tam giác"><svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/></svg></button>
      <button class="ib" data-k="diamond" title="Hình thoi"><svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg></button>
      <button class="ib" data-k="star" title="Ngôi sao"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
      <button class="ib" data-k="line" title="Đường thẳng"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg></button>
    </div>
  </div>
  <button class="ib" data-t="arrow" title="Thêm mũi tên (A)" aria-label="Thêm mũi tên"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
  <button class="ib" data-t="draw" title="Vẽ tự do (D)" aria-label="Vẽ"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg></button>
  <span class="vsep"></span>
  <button class="ib" data-t="section" title="Thêm section (F)" aria-label="Thêm section"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" stroke-dasharray="3 2"/><path d="M3 9h18"/></svg></button>
</div>
<div class="ui pbar" id="pbar" hidden>
  <div id="sw"></div>
  <label title="Chọn màu khác"><input type="color" id="cpick" value="#2f4bff"></label>
  <span class="vsep"></span>
  <span class="lab" id="szl">Nét</span><button class="ghost" id="szm" aria-label="Giảm">−</button><span id="szv"></span><button class="ghost" id="szp" aria-label="Tăng">+</button>
  <button class="ghost" id="odel" title="Xóa đối tượng đang chọn" aria-label="Xóa">🗑</button>
</div>
<div class="ui rbar" id="rbar">
  <button class="ib" id="zi" aria-label="Phóng to" title="Phóng to"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib zp" id="zr" aria-label="Về 100%" title="Về 100%">100%</button>
  <button class="ib" id="zo" aria-label="Thu nhỏ" title="Thu nhỏ"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <span class="hsep"></span>
  <button class="ib" id="theme" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối"></button>
  <span class="hsep"></span>
  <button class="ib" id="fs" title="Xem toàn màn hình" aria-label="Xem toàn màn hình"></button>
</div>
<div id="toast" role="status" hidden></div>
</div>
<dialog id="dlg">
  <div class="dh">Sửa thẻ</div>
  <div class="pv" id="pv"></div>
  <input type="range" id="zm" min="1" max="4" step="0.01" value="1" aria-label="Phóng to ảnh bìa" style="width:100%;margin:10px 0 0">
  <div class="hint">Khung này đúng tỷ lệ ảnh bìa trên thẻ. Kéo ảnh để dời, kéo thanh trượt hoặc cuộn chuột để phóng to.</div>
  <div class="row"><button class="ghost" id="pick">Chọn ảnh bìa…</button><button class="ghost" id="reset">Dùng ảnh mặc định</button></div>
  <input type="file" id="img" accept="image/*" hidden>
  <label>Tên file<input id="nm" type="text"></label>
  
  <div class="row end"><button class="ghost" id="cancel">Hủy</button><button class="primary" id="ok">Lưu</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s);
const board=$('#board'),sc=$('#sc'),empty=$('#empty'),q=$('#q'),cnt=$('#cnt'),dlg=$('#dlg'),pv=$('#pv');
const TYPES={
  pdf:{l:'PDF',c:'#e5383b',k:['pdf'],a:'tai lieu pdf'},
  word:{l:'Word',c:'#2b6cf0',k:['doc','docx','dotx','rtf','odt'],a:'tai lieu van ban doc docx'},
  excel:{l:'Excel',c:'#16a34a',k:['xls','xlsx','xlsm','csv','ods'],a:'tai lieu bang tinh xls xlsx'},
  ppt:{l:'PPT',c:'#ea6a0a',k:['ppt','pptx','potx','odp'],a:'tai lieu powerpoint slide trinh chieu'},
  image:{l:'Ảnh',c:'#8b5cf6',k:['png','jpg','jpeg','gif','webp','svg','bmp','avif'],a:'anh hinh image photo'},
  web:{l:'Web',c:'#0891b2',k:['html','htm','css','js','mjs','json','xml','php','ts','tsx','jsx'],a:'web trang web website html code'},
  video:{l:'Video',c:'#db2777',k:['mp4','mov','avi','mkv','webm','wmv','flv','m4v','mpg','mpeg','3gp'],a:'video phim clip'},
  audio:{l:'Âm thanh',c:'#c026d3',k:['mp3','wav','m4a','aac','ogg','oga','flac'],a:'am thanh nhac mp3 audio music'},
  archive:{l:'Nén',c:'#a16207',k:['zip','rar','7z','tar','gz','tgz','bz2','xz','iso'],a:'nen file nen zip rar 7z archive'},
  other:{l:'Khác',c:'#64748b',k:[],a:'khac file'}
};
const cards=new Map(),urls=new Map();let zTop=1,filter='all',db=null,cur=null,newThumb,pvU=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const fmt=s=>s<1024?s+' B':s<1048576?Math.round(s/1024)+' KB':(s/1048576).toFixed(1)+' MB';
const typeOf=(e,m)=>{for(const t in TYPES)if(TYPES[t].k.includes(e))return t;return (m||'').startsWith('image/')?'image':(m||'').startsWith('video/')?'video':(m||'').startsWith('audio/')?'audio':'other'};
const url=(id,k,b)=>{const key=id+k;if(!urls.has(key))urls.set(key,URL.createObjectURL(b));return urls.get(key)};
const drop=(id,k)=>{const key=id+k;if(urls.has(key)){URL.revokeObjectURL(urls.get(key));urls.delete(key)}};
const FAR=182/118,expanded=new Set(),pcache=new Map(),cl=v=>Math.min(1,Math.max(0,v));let ed=null;
/* Vị trí + kích thước ảnh bìa tính theo % khung, nên khung sửa và thẻ thật luôn giống nhau */
function crop(ar,t){const W=t.z*Math.max(1,ar/FAR)*100,H=t.z*Math.max(1,FAR/ar)*100;return `position:absolute;max-width:none;width:${W}%;height:${H}%;left:${-t.u*(W-100)}%;top:${-t.v*(H-100)}%`}

/* Lưu trữ: IndexedDB (giữ file ngay trong trình duyệt) */
function openDB(){return new Promise(r=>{try{const o=indexedDB.open('bang-trang-v1',3);o.onupgradeneeded=()=>['cards','secs','meta','objs'].forEach(n=>o.result.objectStoreNames.contains(n)||o.result.createObjectStore(n,{keyPath:'id'}));o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()}catch(e){r()}})}
const tx=(m,f,n='cards')=>new Promise(r=>{if(!db)return r();try{const t=db.transaction(n,m),s=f(t.objectStore(n));t.oncomplete=()=>r(s&&s.result);t.onerror=()=>r()}catch(e){r()}});
const save=c=>{cards.set(c.id,c);return tx('readwrite',s=>s.put(c))};

/* Thẻ */
function el(c){
  const t=TYPES[c.type],d=document.createElement('article');
  d.className='card';d.dataset.id=c.id;d.style.cssText=`left:${c.x}px;top:${c.y}px;z-index:${c.z||1};--c:${t.c};transform:scale(${c.sc||1});transform-origin:0 0`;
  const th=c.thumb||(c.type==='image'?c.blob:null),tk=c.thumb?'t':'f';
  const sty=c.tf&&c.ar?crop(c.ar,c.tf):'',ex=expanded.has(c.id);
  
  d.innerHTML=`<div class="th">${th?`<img draggable="false" alt="" style="${sty}" src="${url(c.id,tk,th)}">`:`<span class="ext">${esc((c.ext||'file').toUpperCase())}</span>`}</div>
  <div class="bd"><div class="name" title="Nhấp đúp để mở file">${esc(c.name)}</div>
  <div class="meta"><span class="tag">${t.l}</span><span>${fmt(c.size)}</span></div>
  <div class="act"><button class="go" data-a="open" title="Mở trong tab mới">Mở</button><button data-a="edit" title="Sửa thẻ" aria-label="Sửa thẻ">Sửa</button><button data-a="del" title="Xóa" aria-label="Xóa">✕</button></div><button class="pgb" data-a="pg" title="Xổ xuống trang đầu" aria-label="Xổ xuống trang đầu">${ex?'▴':'▾'}</button></div><i class="cz" title="Kéo để phóng to / thu nhỏ thẻ"></i>${c.link?'<i class="lkb" title="Thẻ này có link">🔗</i>':''}${ex?`<div class="pg">${pcache.get(c.id)||'<div class="note">Đang tải trang đầu…</div>'}</div>`:''}`;
  return d;
}
const redraw=c=>{const o=board.querySelector(`[data-id="${c.id}"]`);o?o.replaceWith(el(c)):board.append(el(c));apply();paintSel()};
function render(){layS.replaceChildren(...[...secs.values()].filter(s=>s.p===st.active).map(secEl));layO.replaceChildren(...objsOf().map(objEl));board.replaceChildren(...mine().map(el));apply();fixSecZ();updLayers();paintSel()}

async function addFiles(files,px,py){
  const o=world(insetL()?332:70,70),made=[];let i=0;
  for(const f of files){
    const m=f.name.match(/\.([^.]+)$/),ext=m?m[1].toLowerCase():'';
    const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,''),ext,type:typeOf(ext,f.type),size:f.size,blob:f,thumb:null,link:'',z:++zTop,
      p:st.active,x:px!=null?px+i*22:o.x+(i%4)*204,y:py!=null?py+i*22:o.y+Math.floor(i/4)*250};
    
    await save(c);made.push({k:'c:'+c.id,b:null,a:{...c}});board.append(el(c));i++;
  }
  done([],made);apply();
}

/* Kéo thả thẻ */
/* Bảng vô hạn: dự án, khung nhìn (kéo nền để di chuyển, Ctrl+cuộn để phóng) */
const st={list:[{id:'p1',name:'Bảng trắng 1'}],active:'p1',views:{}},secs=new Map(),layS=$('#layS'),wld=$('#world'),PAL=['#64748b','#2f4bff','#16a34a','#ea6a0a','#e5383b','#8b5cf6','#db2777','#0891b2'];
let v={x:60,y:60,z:1},stT;
const mine=()=>[...cards.values()].filter(c=>c.p===st.active);
const world=(px,py)=>({x:(px-v.x)/v.z,y:(py-v.y)/v.z});
const saveState=()=>{st.views[st.active]={...v};clearTimeout(stT);stT=setTimeout(()=>tx('readwrite',s=>s.put({id:'state',...st}),'meta'),300)};
const saveS=s=>{secs.set(s.id,s);return tx('readwrite',x=>x.put(s),'secs')};
function applyView(){wld.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;sc.style.backgroundSize=`${26*v.z}px ${26*v.z}px`;sc.style.backgroundPosition=`${v.x}px ${v.y}px`;$('#zr').textContent=Math.round(v.z*100)+'%'}
function zoomAt(f,cx,cy){const z=Math.min(4,Math.max(.2,v.z*f));v.x=cx-(cx-v.x)*z/v.z;v.y=cy-(cy-v.y)*z/v.z;v.z=z;applyView();saveState()}

}
/* Đưa mục vào giữa vùng nhìn thấy nếu nó đang nằm ngoài (hoặc luôn, khi force) */
const insetL=()=>lyOpen&&!document.body.classList.contains('zen')?292:0; /* bề ngang layer bar che mất mép trái bảng */
function reveal(k,force){
  const b=bboxOf(k);if(!b)return;
  const W=sc.clientWidth,H=sc.clientHeight,L=insetL(),R=W-62,cx=(b.x+b.w/2)*v.z+v.x,cy=(b.y+b.h/2)*v.z+v.y;
  if(force||cx<L+24||cx>R-24||cy<24||cy>H-80){v.x=(L+R)/2-(b.x+b.w/2)*v.z;v.y=(H-60)/2-(b.y+b.h/2)*v.z;applyView();saveState()}
}
lyb.addEventListener('click',e=>{
  const r=e.target.closest('.lr');if(!r||e.target.closest('[contenteditable=true]'))return;const k=r.dataset.k;
  if(e.target.closest('[data-a=tg]')){const id=k.slice(2);layCol.has(id)?layCol.delete(id):layCol.add(id);drawLayers();return}
  if(tool)setTool(null);
  if(e.shiftKey||e.ctrlKey||e.metaKey){sel.has(k)?sel.delete(k):sel.add(k)}else{sel.clear();sel.add(k)}
  paintSel();if(sel.has(k))reveal(k);
});
lyb.addEventListener('dblclick',e=>{
  const n=e.target.closest('.nm'),r=n&&n.closest('.lr');if(!r)return;const k=r.dataset.k,o=mapOf(k).get(k.slice(2));if(!o)return;
  if(k[0]==='s')editText(n,t=>{const sn=snap([o]);o.name=t;saveS(o);done(sn);apply();const d=elOf(o),x=d&&d.querySelector('.stt');if(x)x.textContent=t});
  else if(k[0]==='c')editText(n,t=>{const sn=snap([o]);o.name=t;save(o);done(sn);redraw(o)});
  else reveal(k,true);
});
lyb.addEventListener('keydown',e=>{
  const r=e.target.closest('.lr');if(!r||e.target!==r)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();r.click()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=e.key==='ArrowDown'?r.nextElementSibling:r.previousElementSibling;n&&n.focus()}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&r.classList.contains('isS')){
    const id=r.dataset.k.slice(2),want=e.key==='ArrowRight';
    if(want===layCol.has(id)){e.preventDefault();want?layCol.delete(id):layCol.add(id);drawLayers();const n=lyb.querySelector(`.lr[data-k="${r.dataset.k}"]`);n&&n.focus()}
  }
});
$('#lyx').onclick=()=>setLayers(false);$('#lyo').onclick=()=>setLayers(true);
try{const s=localStorage.getItem('bt-layers');lyOpen=s===null?innerWidth>760:s==='1'}catch(e){lyOpen=innerWidth>760}
setLayers(lyOpen,true);

/* ===== Link: thanh nhỏ hiện phía trên mục đang chọn (thẻ file, text, hình, section) ===== */
const lk=$('#lk');let lkEd=false,lkKey='',lkRaf=0;
const selOne=()=>{if(sel.size!==1)return null;const k=[...sel][0];return mapOf(k).get(k.slice(2))||null};
const shortUrl=l=>{const s=l.replace(/^https?:\/\/(www\.)?/i,'');return s.length>36?s.slice(0,36)+'…':s};
function lkBuild(o){
  const l=o.link||'';
  if(lkEd){lk.innerHTML=`<input id="lkin" type="text" placeholder="Dán link (https://…)" value="${esc(l)}" aria-label="Link"><button class="ghost" data-a="ok">Lưu</button><button class="ghost" data-a="no">Hủy</button>`;const i=$('#lkin');i.focus();i.select();return}
  lk.innerHTML=l?`<a href="${esc(l)}" target="_blank" rel="noopener noreferrer" title="${esc(l)}">🔗 ${esc(shortUrl(l))}</a><button class="ghost" data-a="ed" title="Sửa link" aria-label="Sửa link">✎</button><button class="ghost" data-a="rm" title="Gỡ link" aria-label="Gỡ link">✕</button>`
    :`<button class="ghost" data-a="ed">🔗 Thêm link</button>`;
}
function lkPos(o){
  const d=elOf(o);if(!d){lk.hidden=true;return}
  const t=d.classList.contains('ln')?d.querySelector('.hl')||d:d,r=t.getBoundingClientRect(),s=sc.getBoundingClientRect();
  let y=r.top-s.top-10,below=false;if(y<52){y=r.bottom-s.top+10;below=true}
  lk.style.left=cl2(r.left+r.width/2-s.left,120,Math.max(120,s.width-120))+'px';
  lk.style.top=cl2(y,8,Math.max(8,s.height-50))+'px';
  lk.style.transform=below?'translateX(-50%)':'translate(-50%,-100%)';
}
function lkTick(){lkRaf=0;const o=selOne();if(lk.hidden||!o)return;lkPos(o);lkRaf=requestAnimationFrame(lkTick)}
function updLink(){
  const o=selOne(),d=o&&elOf(o),zen=document.body.classList.contains('zen');
  if(!o||!d||d.classList.contains('editing')||(zen&&!o.link)){lk.hidden=true;lkEd=false;lkKey='';return}
  const key=keyOf(o)+'|'+(o.link||'')+'|'+lkEd;
  if(key!==lkKey){lkKey=key;lkBuild(o)}
  lk.hidden=false;lkPos(o);if(!lkRaf)lkRaf=requestAnimationFrame(lkTick);
}
function saveLink(o,val){
  if(!o)return;val=(val||'').trim();if(val&&!/^(https?:|mailto:|tel:)/i.test(val))val='https://'+val;
  const sn=snap([o]);o.link=val;saveAny(o);done(sn);lkEd=false;
  const kk=keyOf(o)[0];if(kk==='c')redraw(o);else{if(kk==='o')redrawO(o);updLink()}
}
lk.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const o=selOne();if(!o)return;const a=b.dataset.a;
  if(a==='ed'){lkEd=true;updLink()}else if(a==='no'){lkEd=false;updLink()}
  else if(a==='ok')saveLink(o,$('#lkin').value);else if(a==='rm')saveLink(o,'');
});
lk.addEventListener('keydown',e=>{
  if(e.target.id!=='lkin')return;
  if(e.key==='Enter'){e.preventDefault();saveLink(selOne(),e.target.value)}
  if(e.key==='Escape'){e.stopPropagation();lkEd=false;updLink()}
});

/* Khởi động: nạp lại các thẻ đã lưu */
(async()=>{
  await openDB();
  const all=await tx('readonly',s=>s.getAll())||[];
  all.forEach(c=>{c.p=c.p||'p1';zTop=Math.max(zTop,c.z||1);cards.set(c.id,c)});
  ((await tx('readonly',s=>s.getAll(),'secs'))||[]).forEach(s=>secs.set(s.id,s));
  ((await tx('readonly',s=>s.getAll(),'objs'))||[]).forEach(o=>{zTop=Math.max(zTop,o.z||1);objs.set(o.id,o)});
  const sv=await tx('readonly',s=>s.get('state'),'meta');
  if(sv&&sv.list&&sv.list.length)Object.assign(st,{list:sv.list,active:sv.active,views:sv.views||{}});
  if(!st.list.some(p=>p.id===st.active))st.active=st.list[0].id;
  v={...(st.views[st.active]||v)};tabs();render();applyView();
})();
</script>
